[pytest]
# Andén de pruebas del proyecto (C-05). Vive dentro de `test/` a propósito: la
# estructura obligatoria de la raíz —main.py, seed.py, alembic.ini, app/,
# migrations/, test/— no cambia.
#
# Al encontrar estas opciones acá, pytest toma `test/` como rootdir y resuelve
# `pythonpath` y `testpaths` **relativos a test/**: `..` es la raíz del repo y
# `.` es esta carpeta. Sin ese `..`, `import app` fallaría porque el rootdir
# apuntaría a test/. Ver design.md (D2) del change.
pythonpath = ..
testpaths = .

asyncio_mode = auto

# Un solo bucle de eventos para toda la corrida: el motor asincrónico y el
# semáforo de bcrypt viven ligados al bucle que los creó, y mezclar bucles
# entre tests produce errores intermitentes de «bound to a different event loop».
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
