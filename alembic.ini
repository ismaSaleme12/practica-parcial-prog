# Configuración de Alembic.
#
# La URL de la base NO se declara acá: `migrations/env.py` la toma de
# `app.core.config.settings` (variables de entorno o .env). Este archivo se
# versiona, así que no puede contener credenciales.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Nombres de archivo: 0001_crea_las_tablas.py, 0002_solo_agregado.py, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
